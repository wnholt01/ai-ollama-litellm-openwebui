# Aliases on the left are what appear in Open WebUI's model picker.
# Verify model tags against ollama.com/library and the provider docs before deploying.

model_list:
  # ---- Local chat: T420 RTX 3090 first, 5090 desktop when the T420 is down or full ----
  # Same model_name + order = one entry in Open WebUI; LiteLLM picks the deployment.
  - model_name: local-chat
    litellm_params:
      model: ollama_chat/qwen3.6-35b-iq4-tools
      api_base: os.environ/T420_OLLAMA_URL
      order: 1
      max_parallel_requests: 2        # keep equal to OLLAMA_NUM_PARALLEL on the T420
      timeout: 180
      stream_timeout: 60              # fail over quickly if the T420 is off
  - model_name: local-chat
    litellm_params:
      model: ollama_chat/qwen3.6-35b-128k
      api_base: http://wake-proxy:11434
      order: 2
      keep_alive: "2m"
      timeout: 180                    # must exceed the wake-proxy's 90s wake window

  # ---- Local embeddings: CPU on the swarm (never wakes the desktop) ----
  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama-cpu:11434

  # ---- Frontier ----
  - model_name: claude
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  # ---- Hermes Agents ----    
  - model_name: hermes-main            # 3090: always on, the default
    litellm_params:
      model: ollama_chat/qwen3.6-35b-iq4-tools
      api_base: http://192.168.1.149:11434
      timeout: 300
    model_info:
      supports_function_calling: true

  - model_name: hermes-5090            # 5090: on request (wakes the desktop)
    litellm_params:
      model: ollama_chat/qwen3.6-35b-128k
      api_base: http://wake-proxy:11434
      timeout: 300                     # includes wake-up + model load
    model_info:
      supports_function_calling: true

guardrails:
  - guardrail_name: headroom-compression
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: http://headroom:8787
      default_on: true

router_settings:
  # local-chat: T420 (order 1) -> 5090 (order 2) -> claude
  # Everything else: desktop unreachable or stopped for gaming -> frontier
  fallbacks:
    - local-chat: ["claude"]
    - hermes-main: ["hermes-5090"]   # 3090 down → wake the 5090
    - hermes-5090: ["hermes-main"]   # 5090 unavailable → 3090 takes over

  num_retries: 1
  cooldown_time: 30
  allowed_fails: 1

litellm_settings:
  drop_params: true
  max_budget: 20           # USD per 30 days across frontier keys
  budget_duration: 30d
  cache: true
  cache_params:
    type: redis

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
